name: Update eczaneler.json

on:
  # Scheduled runs disabled because upstream blocks requests from GitHub Actions runners
  # (requests were returning 403). Use the Vercel production cron instead. Keep a
  # manual dispatch so you can run this workflow on-demand if needed.
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch eczaneler
        run: node scripts/fetchEczaneler.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add public/eczaneler.json || true
            git commit -m "chore: update eczaneler.json (automated)" || true
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
