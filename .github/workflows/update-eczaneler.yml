name: Update eczaneler.json

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC (adjust as needed)
    - cron: '0 16 * * *'  # every day at 16:00 UTC (matches vercel.json crons)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Fetch eczaneler
        run: node scripts/fetchEczaneler.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add public/eczaneler.json || true
            git commit -m "chore: update eczaneler.json (automated)" || true
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
