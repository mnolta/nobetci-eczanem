name: Check eczaneler-meta

on:
  schedule:
    # every 6 hours (matches upstream 6h update frequency)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run eczaneler meta monitor
        env:
          META_URL: ${{ secrets.META_URL || 'https://nobetci-eczanem.vercel.app/eczaneler-meta.json' }}
          # Threshold is slightly above upstream update interval (6h -> 7h)
          THRESHOLD_HOURS: '7'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/checkEczanelerMeta.js
